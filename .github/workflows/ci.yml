name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.package }} · lint · types · unit · sr · a11y
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vue joins the matrix once its a11y harness lands.
        package: [react, solid]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json is intentionally git-ignored (the macOS-generated
      # lockfile breaks rolldown's native bindings on Linux), so each env
      # resolves its own deps — hence `npm install`, not `npm ci`, and no
      # lockfile-keyed setup-node cache.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --workspace @wire-ui/${{ matrix.package }}

      # Vitest transpiles via esbuild and does NOT type-check, so type errors in
      # tests/source slip past unit/a11y and only fail the Vercel build (tsc -b).
      # This step type-checks the same way the deploy does, failing CI first.
      - name: Type check
        run: npm run typecheck --workspace @wire-ui/${{ matrix.package }}

      - name: Unit tests
        run: npm run test:unit --workspace @wire-ui/${{ matrix.package }}

      # Screen-reader semantics: accessible name/role/state/relationships and
      # live-region announcements that axe-core's static audit can't verify.
      # These run in jsdom (no browser) and are also covered by `test:unit`;
      # this dedicated step surfaces the screen-reader pass as its own signal.
      - name: Screen reader semantics
        run: npm run test:sr --workspace @wire-ui/${{ matrix.package }}

      # SSR safety + hydration audit: Solid needs a separate server compile
      # target (generate:'ssr' + the solid-js/web server build) for the render
      # phase and a dom+hydratable target for the hydrate phase, so this runs as
      # its own step rather than inside the jsdom unit project. It renders every
      # scenario on the server and replays it through a real hydrate(), failing on
      # any hydration-mismatch console error. (React's equivalent runs inside
      # test:unit, since react-dom/server + hydrateRoot both work in jsdom.)
      - name: SSR + hydration audit
        if: matrix.package == 'solid'
        run: npm run test:hydrate --workspace @wire-ui/${{ matrix.package }}

      # axe-core runs against every story in a real browser, so we need the
      # Playwright Chromium binary the Vitest browser project drives.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core via Storybook)
        run: npm run test:a11y --workspace @wire-ui/${{ matrix.package }}

      # --- Performance & packaging gates (react + solid) ---

      # Verify every component compiles under the framework compiler:
      # React 19 compiler (react) / Solid 1.x JSX compiler in dom+ssr (solid).
      - name: Compiler compatibility
        if: matrix.package == 'react' || matrix.package == 'solid'
        run: npm run compiler:check --workspace @wire-ui/${{ matrix.package }}

      # attw runs against the built dist, so build first. (Per-component bundle
      # budgets run in the dedicated `bundle-size` job below, across all three
      # frameworks.)
      - name: Build
        if: matrix.package == 'react' || matrix.package == 'solid'
        run: npm run build --workspace @wire-ui/${{ matrix.package }}

      # Validate published type resolution across module systems.
      - name: Type resolution (are-the-types-wrong)
        if: matrix.package == 'react' || matrix.package == 'solid'
        run: npm run attw --workspace @wire-ui/${{ matrix.package }}

  # Per-component bundle-size budgets. Lives in its own job (not the quality
  # matrix) so Vue is gated too — Vue is held out of `quality` until its a11y
  # harness lands, but its size budgets are ready now. Each package's
  # .size-limit.json holds a budget per component; `npm run size` fails if a
  # tree-shaken import grows past its budget. Re-baseline with
  # `npm run size:update` from the repo root.
  bundle-size:
    name: ${{ matrix.package }} · per-component bundle budgets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [react, solid, vue]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --workspace @wire-ui/${{ matrix.package }}

      - name: Per-component bundle budgets
        run: npm run size --workspace @wire-ui/${{ matrix.package }}

  # API parity matrix drift check. The matrix published in the docs is generated
  # from each package's export surface; this fails if a component/hook was added
  # to one framework without regenerating it (`npm run parity:update`). It's a
  # pure source parse, so it needs neither dependencies nor a build.
  api-parity:
    name: api parity matrix · drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check parity matrix is up to date
        run: npm run parity:check

  # Behavioral parity tests. The same framework-agnostic scenarios
  # (@wire-ui/parity-tests) are run against each framework's real components, so
  # identical observable behavior — data-* state, ARIA, focus, keyboard — is
  # asserted everywhere. A divergence in one framework fails only that leg.
  # No build: the suite imports components from source via vitest. Vue runs here
  # too (it's still held out of the `quality` matrix).
  behavioral-parity:
    name: ${{ matrix.package }} · behavioral parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [react, solid, vue]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Behavioral parity scenarios
        run: npm run test:parity --workspace @wire-ui/${{ matrix.package }}
